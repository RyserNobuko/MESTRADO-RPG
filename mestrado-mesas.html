<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mestrado de RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#edeef4; --surface:#f8f8fc; --surface2:#e2e4ee; --field:#ffffff;
  --fg:#1c1e2d; --muted:#5b5f78; --line:#cdd0e0;
  --accent:#1d6b74; --accent-fg:#ffffff; --gold:#8f6310;
  --danger:#a52f3b; --ok:#2b7a4b; --warn:#9a6210;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12141f; --surface:#1a1d2c; --surface2:#242839; --field:#141726;
  --fg:#e6e7f2; --muted:#9a9eb8; --line:#2f344b;
  --accent:#4cc2c9; --accent-fg:#0b1a1c; --gold:#dcaa4a;
  --danger:#e57a85; --ok:#62c18a; --warn:#e3a64e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 17px/1.45 var(--body);padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:.42rem .6rem}
input[readonly],textarea[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
textarea{resize:vertical;min-height:5.5rem;line-height:1.45}
input[type=checkbox]{width:1.15rem;height:1.15rem;padding:0;accent-color:var(--accent)}
input[type=number]{font-family:var(--mono);font-size:.95rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);font-weight:400}
label.f input[readonly],label.f textarea[readonly]{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.4rem .85rem;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.sm{padding:.22rem .55rem;font-size:.9rem}
.btn.danger:hover,.btn.armed{border-color:var(--danger);color:var(--danger)}
.btn.armed{font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:.2rem .45rem;border-radius:var(--r)}
.x:hover{color:var(--danger)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:.92rem;margin:0}
.empty{color:var(--muted);font-style:italic;margin:.3rem 0}
.msg{min-height:1.4em;font-size:.95rem;color:var(--muted);margin-bottom:8px}
.msg.err{color:var(--danger)}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px;flex:1 1 260px;min-width:0}
.brand small{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand h1{font-size:1.9rem;line-height:1.1;overflow-wrap:anywhere}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}
.who b{color:var(--fg);font-weight:500;overflow-wrap:anywhere}
.badge{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:.05rem .6rem;white-space:nowrap}
.badge.master{color:var(--gold)}.badge.player{color:var(--accent)}.badge.npc{color:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.tabs button{padding:.6rem 1.1rem;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;white-space:nowrap;cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current=page]{color:var(--fg);border-bottom-color:var(--accent)}

/* telas de entrada */
.center{max-width:440px;margin:6vh auto 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;min-width:0}
.panel>h2{font-size:1.15rem;color:var(--gold);letter-spacing:.05em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice button:hover,.choice button[aria-pressed=true]{border-color:var(--accent)}
.choice button[aria-pressed=true]{background:var(--surface2)}
.choice strong{font-family:var(--display);font-size:1.2rem}
.choice span{color:var(--muted);font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:1.1rem;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.codebox{font-family:var(--mono);font-size:.82rem}

/* layout da mesa */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.side{position:sticky;top:12px}
.grid{display:grid;gap:12px}
.g-id{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.charbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.charbar label.f{flex:1 1 220px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.vbox{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field);display:flex;flex-direction:column;gap:6px;min-width:0}
.vbox>span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.vbox input{border:0;background:transparent;padding:0;font-family:var(--mono);font-size:1.6rem;font-weight:500;width:100%}
.hp-line{display:flex;align-items:center;gap:6px}
.hp-line .slash{color:var(--muted);font-family:var(--mono)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .2s}
.bar>i.low{background:var(--warn)}.bar>i.crit{background:var(--danger)}
.hp-btns{display:flex;gap:4px;flex-wrap:wrap}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}
.attr{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.attr .attr-name{text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.06em;border:0;background:transparent;padding:0;font-size:1rem;color:var(--gold)}
.mod{font-family:var(--mono);font-size:1.9rem;font-weight:500;line-height:1}
.attr .attr-val{width:4.2rem;text-align:center}
.attr-act{display:flex;gap:4px;align-items:center}
.attr .tot{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.attr .tot b{font-family:var(--mono);color:var(--fg);font-weight:500}
.attr .base{display:flex;align-items:center;gap:6px;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fxb{font-family:var(--mono);font-size:.75rem;font-weight:700;border:1px solid currentColor;border-radius:99px;padding:0 .45rem}
.fxb.up{color:var(--ok)}.fxb.down{color:var(--danger)}
.btn.pen{padding:.22rem .5rem}.btn.pen svg{width:1rem;height:1rem;display:block}
.btn.pen[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.attr.open{grid-column:1/-1}
.fx{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;display:grid;gap:8px;width:100%}
.fx h3{font-size:.95rem;color:var(--gold);letter-spacing:.05em}
.fx-row{display:grid;grid-template-columns:auto minmax(0,1fr) 5rem auto;gap:8px;align-items:center}
.fx-row.off input[type=text]{color:var(--muted);text-decoration:line-through}
.fx-row input.up{color:var(--ok)}.fx-row input.down{color:var(--danger)}
.fx-add{display:flex;gap:8px;flex-wrap:wrap}
.mm{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:12px;margin-bottom:14px;display:grid;gap:10px}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mm-cell{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:var(--surface)}
.mm-cell span{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.mm-cell input{text-align:center;padding:.2rem;width:100%}
.mm-cell.custom{border-color:var(--gold)}.mm-cell.custom span{color:var(--gold);font-weight:700}
.rows{display:flex;flex-direction:column;gap:8px}
.r-skill{display:grid;grid-template-columns:minmax(0,1fr) 5rem auto auto;gap:8px;align-items:center}
.r-item{display:grid;grid-template-columns:minmax(0,1.2fr) 4.5rem minmax(0,1.5fr) auto;gap:8px;align-items:center}
.r-cust{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
.abil{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field);display:grid;gap:8px}
.abil .head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.abil textarea{min-height:4rem}
.idwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.photo-box{display:flex;flex-direction:column;gap:8px;width:150px}
.photo{width:150px;height:150px;border:1px dashed var(--line);border-radius:10px;background:var(--field);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-act{display:flex;gap:6px;flex-wrap:wrap}
.photo-act .btn{position:relative;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lockn{color:var(--muted);font-size:.88rem;margin:0 0 10px}

/* dados */
.dice-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.dice-row .btn{justify-content:center;font-family:var(--mono);font-size:.9rem;padding:.45rem 0}
.dice-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.result{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;min-height:6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-bottom:10px}
.result .total{font-family:var(--mono);font-size:2.8rem;line-height:1;font-weight:500}
.result .total.crit{color:var(--ok)}.result .total.fumble{color:var(--danger)}
.result .expr{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.92rem;max-height:16rem;overflow:auto}
.log li{display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding-top:4px}
.log b{font-family:var(--mono);min-width:2.4rem}
.log span{flex:1;min-width:0;overflow-wrap:anywhere}
.log small{color:var(--muted)}

/* anotações, npcs, roteiro */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.nlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:62vh;overflow:auto}
.nitem{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.nitem.on{border-color:var(--accent);background:var(--surface2)}
.nitem .nt{font-weight:700;overflow-wrap:anywhere}
.nitem .nm{font-size:.82rem;color:var(--muted)}
.nrow{display:flex;gap:10px;align-items:center;min-width:0}
.ntx{display:flex;flex-direction:column;gap:2px;min-width:0}
.nthumb{width:38px;height:38px;border-radius:6px;object-fit:cover;flex:none}
.pinned{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 .4rem;margin-right:.3rem;vertical-align:1px}
.ned{display:grid;gap:12px}
.ned textarea.big{min-height:46vh;font-size:1.05rem}
.sc-sum{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:14px}
.prog{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.prog .bar>i{background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.2rem .8rem;cursor:pointer;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
details.scene{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.scene>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 16px}
details.scene>summary::-webkit-details-marker{display:none}
details.scene>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.scene[open]>summary::before{transform:rotate(90deg)}
.sc-n{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.sc-title{font-family:var(--display);font-weight:700;font-size:1.15rem;flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.tag{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.05rem .6rem}
.pill{font-size:.8rem;font-weight:700;border-radius:99px;padding:.05rem .65rem;border:1px solid currentColor}
.pill.plan{color:var(--muted)}.pill.andamento{color:var(--accent)}.pill.ok{color:var(--ok)}
.sc-body{padding:2px 16px 16px;display:grid;gap:12px}
.g-sc{grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr))}
.objs{display:flex;flex-direction:column;gap:6px}
.obj{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.obj.is-done input[type=text]{text-decoration:line-through;color:var(--muted)}
.mtable{width:100%;border-collapse:collapse;font-size:.95rem}
.mtable th,.mtable td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.mtable th{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-top:0}
.scroll-x{overflow-x:auto}
.npc-card{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--field);margin-bottom:12px}
.npc-card .photo,.npc-card .photo-box{width:110px}.npc-card .photo{height:110px}
@media (max-width:860px){.cols,.split{grid-template-columns:minmax(0,1fr)}.side{position:static}.g-sc{grid-template-columns:minmax(0,1fr)}.nlist{max-height:30vh}}
@media (max-width:560px){.idwrap,.npc-card{grid-template-columns:minmax(0,1fr)}.r-item{grid-template-columns:minmax(0,1fr) 4.5rem auto}.r-item .r-note{grid-column:1/-1;order:5}.brand h1{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,collection,setDoc,getDoc,getDocs,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== CONFIGURAÇÃO: cole aqui os dados do seu projeto Firebase (veja o LEIA-ME) ===== */
const firebaseConfig={
  apiKey:'COLE_AQUI',
  authDomain:'SEU-PROJETO.firebaseapp.com',
  projectId:'SEU-PROJETO',
  appId:'COLE_AQUI'
};
/* ================================================================================== */

const CONFIGURED=!/^COLE/.test(firebaseConfig.apiKey);
let auth,db;
const APP=document.getElementById('app');
const $=(s,r)=>(r||document).querySelector(s);
const uid8=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>n>=0?'+'+n:'−'+Math.abs(n);
const fmtDate=t=>{try{return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}catch(e){return ''}};
const TAGS=['Sessão','NPC','Local','Item','Regra','Ideia','Outro'];
const TYPES=['Exploração','Combate','Social','Mistério','Descanso'];
const STATUS=['Planejado','Em andamento','Concluído'];
const DICE=[4,6,8,10,12,20,100];
const IDENT=['name','cls','race','bg','align'];
const PLAYER_FIELDS=['name','cls','race','bg','align','story','look','traits','skills','photo'];
const MASTER_BLOCKED=IDENT;
const ROLE_LABEL={master:'Mestre',player:'Player',npc:'NPC'};

/* ---------- estado global ---------- */
let me=null,prof=null,myTables=[],homeTab='master',T=null,screen='loading',authMode='login',authMsg='',joinInfo=null,unsubHome=null;
let dirty=false,toastT=null,dCount=1,dMod=0,lastRoll=null,creating={name:'',cls:'',race:'',bg:'',align:'',story:'',look:'',traits:'',i1:'',i2:'',i3:''};
const openFx=new Set(),openScenes=new Set();let rulesOpen=false,scFilter='Todas',nq='';

const MM=()=>(T&&T.doc&&T.doc.modMap)||{};
function mod(v){const n=Math.round(Number(v)||0),m=MM()[n];if(m!==undefined&&m!==null&&m!==''&&!isNaN(Number(m)))return Number(m);return Math.floor((Number(v)-10)/2)}
const fxNet=a=>(a.fx||[]).reduce((s,x)=>s+(x.on?Number(x.val)||0:0),0);
const eff=a=>(Number(a.val)||0)+fxNet(a);

/* ---------- gravação com atraso e proteção contra eco ---------- */
const pend=new Map(),deferred={};
function schedule(key,fn,ms=450){
  clearTimeout(pend.get(key));
  pend.set(key,setTimeout(async()=>{
    try{await fn()}catch(e){toast(e&&e.code==='permission-denied'?'Sem permissão para salvar essa alteração.':'Erro ao salvar: '+(e&&e.message||e),true)}
    pend.delete(key);
    if(!pend.size){const d=Object.values(deferred);for(const k in deferred)delete deferred[k];d.forEach(f=>f())}
  },ms));
}
function apply(key,fn){if(pend.size)deferred[key]=fn;else fn()}
function toast(t,err){const el=$('#msg');if(!el)return;el.textContent=t;el.className='msg'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>{if(el)el.textContent=''},5000)}
const typing=()=>{const a=document.activeElement;return !!(a&&APP.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','file','button'].includes(a.type))))};
function softRender(){if(typing())dirty=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!typing()){dirty=false;render()}},60));

/* ---------- papéis e permissões ---------- */
const role=()=>T&&T.role;
function canChar(f){const r=role();if(r==='master')return !MASTER_BLOCKED.includes(f);if(r==='player')return PLAYER_FIELDS.includes(f);return false}
function canList(l){const r=role();if(r==='master')return true;if(r==='player')return l==='skills';return false}
function VC(){const r=role();if(r==='master')return T.chars[T.view]||null;if(r==='player')return T.chars[me.uid]||null;return null}
const ref=(...p)=>doc(db,'tables',T.id,...p);
const col=(...p)=>collection(db,'tables',T.id,...p);

/* ---------- imagens ---------- */
function readImage(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)||file.size>20*1024*1024)return rej(new Error('img'));
    const fr=new FileReader();fr.onerror=()=>rej(new Error('img'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{const M=400,w=im.naturalWidth||1,h=im.naturalHeight||1,k=Math.min(1,M/Math.max(w,h));
        const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        try{res(cv.toDataURL('image/jpeg',0.8))}catch(e){rej(e)}};
      im.src=String(fr.result)};
    fr.readAsDataURL(file);
  });
}

const AUTH_ERR={'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.','auth/weak-password':'A senha precisa de ao menos 6 caracteres.','auth/email-already-in-use':'Esse e-mail já tem conta. Use Entrar.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem conexão com a internet.','auth/missing-email':'Digite o e-mail.'};
async function boot(){
  if(!CONFIGURED){screen='setup';render();return}
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,async u=>{
    closeTable();if(unsubHome){unsubHome();unsubHome=null}
    if(!u){me=null;prof=null;myTables=[];screen='auth';render();return}
    me={uid:u.uid,email:u.email||''};
    try{
      const ps=await getDoc(doc(db,'users',me.uid));
      prof=ps.exists()?ps.data():null;
      if(!prof||!prof.mode){screen='mode';render();}
      else {homeTab=prof.mode;}
      unsubHome=onSnapshot(collection(db,'users',me.uid,'tables'),s=>{myTables=s.docs.map(d=>({id:d.id,...d.data()}));if(screen==='home')softRender()});
      if(prof&&prof.mode)route();
    }catch(e){screen='auth';authMsg='Não foi possível carregar seu perfil: '+(e.message||e);render()}
  });
  window.addEventListener('hashchange',route);
}
function route(){
  if(!me)return;
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(prof&&!prof.mode){screen='mode';return render()}
  if(h[0]==='t'&&h[1]){if(!T||T.id!==h[1])openTable(h[1]);else{screen='table';render()}return}
  if(h[0]==='join'&&h[1]&&h[2]){openJoin(h[1],h[2]);return}
  closeTable();screen='home';render();
}

/* ---------- mesa: abrir e assinar dados ---------- */
function closeTable(){if(T){T.unsubs.forEach(u=>{try{u()}catch(e){}});}T=null;pend.forEach(clearTimeout);pend.clear();for(const k in deferred)delete deferred[k]}
async function openTable(id){
  closeTable();
  T={id,loading:true,error:'',doc:null,role:null,member:null,members:[],chars:{},npcs:[],notes:[],scenes:[],rolls:[],unsubs:[],tab:null,view:null,selNote:null};
  screen='table';render();
  const t=T;
  try{
    const ms=await getDoc(doc(db,'tables',id,'members',me.uid));
    if(T!==t)return;
    if(!ms.exists()){t.error='Você não tem acesso a esta mesa.';t.loading=false;return render()}
    t.member=ms.data();t.role=t.member.role;
    t.tab=t.role==='master'?'fichas':t.role==='player'?'ficha':'npc';
    subscribe(t);
  }catch(e){t.error='Não foi possível abrir a mesa: '+(e.code==='permission-denied'?'sem acesso.':(e.message||e));t.loading=false;render()}
}
function sub(t,key,q,fn){
  t.unsubs.push(onSnapshot(q,s=>{if(T!==t)return;apply(key,()=>{if(T!==t)return;fn(s);softRender()})},e=>{if(T!==t)return;t.error='Erro ao ler dados ('+key+'): '+(e.code==='permission-denied'?'sem permissão.':(e.message||e));render()}));
}
function subscribe(t){
  const id=t.id,C=(...p)=>collection(db,'tables',id,...p);
  sub(t,'table',doc(db,'tables',id),s=>{if(!s.exists()){t.error='Esta mesa não existe mais.'}else{t.doc=s.data()}t.loading=false});
  sub(t,'members',C('members'),s=>{t.members=s.docs.map(d=>d.data())});
  sub(t,'npcs',C('npcs'),s=>{t.npcs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''))});
  sub(t,'rolls',query(C('rolls'),orderBy('ts','desc'),limit(20)),s=>{t.rolls=s.docs.map(d=>d.data())});
  sub(t,'notes',query(C('notes'),where('authorUid','==',me.uid)),s=>{t.notes=s.docs.map(d=>({id:d.id,...d.data()}))});
  if(t.role==='master'){
    sub(t,'chars',C('chars'),s=>{t.chars={};s.docs.forEach(d=>{t.chars[d.id]=d.data()});if(!t.chars[t.view])t.view=Object.keys(t.chars)[0]||null});
    sub(t,'scenes',C('scenes'),s=>{t.scenes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0))});
  }else if(t.role==='player'){
    sub(t,'chars',doc(db,'tables',id,'chars',me.uid),s=>{t.chars={};if(s.exists())t.chars[me.uid]=s.data()});
  }
}

async function openJoin(tid,code){
  closeTable();screen='join';joinInfo={tid,code,loading:true,error:'',kind:'player',npcId:'',npcs:[]};render();
  const ji=joinInfo;
  try{
    const m=await getDoc(doc(db,'tables',tid,'members',me.uid));
    if(m.exists()){location.hash='#/t/'+tid;return}
  }catch(e){}
  try{
    const inv=await getDoc(doc(db,'tables',tid,'invites',code));
    if(joinInfo!==ji)return;
    if(!inv.exists()){ji.error='Este link de convite não é válido ou foi cancelado pelo mestre.';ji.loading=false;return render()}
    ji.tableName=inv.data().tableName||'Mesa';ji.loading=false;
    try{const ns=await getDocs(collection(db,'tables',tid,'npcs'));ji.npcs=ns.docs.map(d=>({id:d.id,...d.data()})).filter(n=>!n.claimedBy)}catch(e){ji.npcs=[]}
    render();
  }catch(e){ji.error='Não foi possível ler o convite.';ji.loading=false;render()}
}
async function doJoin(){
  const ji=joinInfo,kind=ji.kind;
  if(kind==='npc'&&!ji.npcId){toast('Escolha qual NPC você vai atuar.',true);return}
  try{
    const b=writeBatch(db);
    const mem={uid:me.uid,email:me.email,role:kind,inviteCode:ji.code,joinedAt:Date.now()};
    if(kind==='npc')mem.npcId=ji.npcId;
    b.set(doc(db,'tables',ji.tid,'members',me.uid),mem);
    if(kind==='npc')b.update(doc(db,'tables',ji.tid,'npcs',ji.npcId),{claimedBy:me.uid});
    b.set(doc(db,'users',me.uid,'tables',ji.tid),{name:ji.tableName,role:kind,ts:Date.now()});
    await b.commit();
    location.hash='#/t/'+ji.tid;
  }catch(e){toast(e.code==='permission-denied'?'Não foi possível entrar. O link pode ter sido cancelado ou esse NPC já foi escolhido.':'Erro: '+(e.message||e),true)}
}
const inviteLink=()=>location.href.split('#')[0]+'#/join/'+T.id+'/'+T.doc.inviteCode;
async function makeInvite(){
  const code=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const b=writeBatch(db);
  if(T.doc.inviteCode)b.delete(ref('invites',T.doc.inviteCode));
  b.set(ref('invites',code),{createdBy:me.uid,tableName:T.doc.name,createdAt:Date.now()});
  b.update(ref(),{inviteActive:true,inviteCode:code});
  await b.commit();
}
async function revokeInvite(){
  const b=writeBatch(db);
  if(T.doc.inviteCode)b.delete(ref('invites',T.doc.inviteCode));
  b.update(ref(),{inviteActive:false,inviteCode:''});
  await b.commit();
}

async function roll(sides,count,md,label){
  count=Math.max(1,Math.min(50,Math.floor(Number(count)||1)));md=Math.floor(Number(md)||0);
  const parts=[];let sum=0;for(let i=0;i<count;i++){const r=1+Math.floor(Math.random()*sides);parts.push(r);sum+=r}
  const total=sum+md;let cls='';if(sides===20&&count===1){if(parts[0]===20)cls='crit';else if(parts[0]===1)cls='fumble'}
  const expr=count+'d'+sides+(md?(md>0?'+':'−')+Math.abs(md):'')+' ['+parts.join(', ')+']';
  lastRoll={label,expr,total,cls};renderDice();
  try{await setDoc(doc(collection(db,'tables',T.id,'rolls')),{uid:me.uid,name:myName(),label:label||'',expr,total,cls,ts:serverTimestamp()})}
  catch(e){toast('A rolagem apareceu só para você (não foi possível compartilhar).',true)}
}

  const big=$('#rollBig'),log=$('#rollLog');
  if(big){if(!lastRoll)big.innerHTML='<span class="expr">Escolha um dado para rolar.</span>';
    else big.innerHTML=`<div class="total ${lastRoll.cls}">${lastRoll.total}</div><div class="expr">${esc(lastRoll.label?lastRoll.label+' · ':'')}${esc(lastRoll.expr)}${lastRoll.cls==='crit'?' · crítico':lastRoll.cls==='fumble'?' · falha crítica':''}</div>`}

}

/* ---------- edição de campos ---------- */
function curArr(l){const c=VC();return c&&c[l]}
function writeChar(patch,key){const c=T.view&&role()==='master'?T.view:me.uid;const cid=role()==='master'?T.view:me.uid;schedule('c:'+cid+':'+key,()=>updateDoc(charRef(cid),patch))}
function onEdit(e){
  const t=e.target;if(!t.dataset||!t.dataset.f||!T&&t.dataset.s!=='cr')return;
  const s=t.dataset.s,f=t.dataset.f,id=t.dataset.id;
  let v;if(t.type==='checkbox')v=t.checked;else if(t.type==='number')v=t.value===''?0:Number(t.value);else v=t.value;
  if(s==='cr'){creating[f]=v;return}
  if(s==='mm'){
    if(role()!=='master')return;
    const key=t.dataset.v,nv=t.value===''?null:Math.round(Number(t.value)),dflt=Math.floor((Number(key)-10)/2),mm={...MM()};
    if(e.type==='change'){if(nv===null||isNaN(nv))delete mm[key];T.doc.modMap=mm;t.value=mod(Number(key));return}
    if(nv===null||isNaN(nv)||nv===dflt)delete mm[key];else mm[key]=nv;
    T.doc.modMap=mm;const cell=t.closest('.mm-cell');if(cell)cell.classList.toggle('custom',mm[key]!==undefined);
    const k2=Object.keys(mm).length,cnt=$('#mmCount');if(cnt)cnt.textContent=k2+' '+(k2===1?'valor alterado':'valores alterados');
    const c=VC();if(c)c.attrs.forEach(refreshAttr);
    const copy={...mm};schedule('tb:mm',()=>updateDoc(ref(),{modMap:copy}));return;
  }
  if(s==='tb'){if(role()!=='master')return;T.doc[f]=v;const val=v;schedule('tb:'+f,async()=>{await updateDoc(ref(),{[f]:val});if(f==='name')await setDoc(doc(db,'users',me.uid,'tables',T.id),{name:val},{merge:true})});return}
  if(s==='c'){
    if(!canChar(f))return;const c=VC();if(!c)return;c[f]=v;const val=v;writeChar({[f]:val},f);
    if(f==='hp'||f==='hpMax'){const b=$('#hpbar');if(b){b.style.width=hpPct(c)+'%';b.className=hpClass(c)}}
    return;
  }
  if(s==='li'){
    const l=t.dataset.l;if(!canList(l))return;const c=VC();if(!c)return;
    const o=c[l].find(x=>x.id===id);if(!o)return;o[f]=v;
    if(l==='attrs'&&f==='val')refreshAttr(o);
    const copy=JSON.parse(JSON.stringify(c[l]));writeChar({[l]:copy},l);return;
  }
  if(s==='fx'){
    if(role()!=='master')return;const c=VC();const a=c.attrs.find(x=>x.id===t.dataset.a);const o=a&&a.fx.find(x=>x.id===id);if(!o)return;o[f]=v;refreshAttr(a);
    if(f==='val')t.className=v>0?'up':v<0?'down':'';
    if(f==='on'){const rw=t.closest('.fx-row');if(rw)rw.classList.toggle('off',!v)}
    const copy=JSON.parse(JSON.stringify(c.attrs));writeChar({attrs:copy},'attrs');return;
  }
  if(s==='n'){
    const n=T.notes.find(x=>x.id===id);if(!n)return;n[f]=v;n.upd=Date.now();const val=v;
    schedule('n:'+id+':'+f,()=>updateDoc(ref('notes',id),{[f]:val,upd:Date.now()}));
    const nl=$('#noteList');if(nl)nl.innerHTML=noteListHtml();
    if(e.type==='change'&&f==='tag'){const ed=$('#noteEd');if(ed)ed.innerHTML=noteEditorHtml()}return;
  }
  if(s==='np'){if(role()!=='master')return;const n=T.npcs.find(x=>x.id===id);if(!n)return;n[f]=v;const val=v;schedule('np:'+id+':'+f,()=>updateDoc(ref('npcs',id),{[f]:val}));return}
  if(s==='sc'){
    if(role()!=='master')return;const sc=T.scenes.find(x=>x.id===id);if(!sc)return;sc[f]=v;const val=v;schedule('sc:'+id+':'+f,()=>updateDoc(ref('scenes',id),{[f]:val}));
    if(f==='title'){const ti=$(`details[data-id="${id}"] .sc-title`);if(ti)ti.textContent=v||'Sem título'}
    if(e.type==='change'&&(f==='status'||f==='type'))render();return;
  }
  if(s==='ob'){
    if(role()!=='master')return;const sc=T.scenes.find(x=>x.id===t.dataset.sc);const o=sc&&sc.objs.find(x=>x.id===id);if(!o)return;o[f]=v;
    const copy=JSON.parse(JSON.stringify(sc.objs));schedule('sc:'+sc.id+':objs',()=>updateDoc(ref('scenes',sc.id),{objs:copy}));
    if(e.type==='change'&&f==='done')render();return;
  }
}
function refreshAttr(a){
  const m=$(`[data-mod="${a.id}"]`),t=$(`[data-tot="${a.id}"]`),b=$(`[data-fxb="${a.id}"]`),n=fxNet(a);
  if(m)m.textContent=sgn(mod(eff(a)));if(t)t.textContent=eff(a);
  if(b){b.hidden=!n;b.textContent=sgn(n);b.className='fxb '+(n>0?'up':'down')}
}
document.addEventListener('input',e=>{
  if(e.target.id==='nSearch'){nq=e.target.value;const nl=$('#noteList');if(nl)nl.innerHTML=noteListHtml();return}
  if(e.target.id==='dCount'){dCount=e.target.value;return}if(e.target.id==='dMod'){dMod=e.target.value;return}
  onEdit(e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='charSel'){T.view=t.value;render();return}
  if(t.id==='joinNpc'){joinInfo.npcId=t.value;return}
  if(t.dataset&&t.dataset.up&&t.files&&t.files[0]){
    const kind=t.dataset.up,file=t.files[0];t.value='';
    readImage(file).then(async url=>{
      try{
        if(kind==='char'){if(!canChar('photo'))return;const c=VC();c.photo=url;await updateDoc(charRef(role()==='master'?T.view:me.uid),{photo:url});render()}
        else if(kind==='note'){const n=T.notes.find(x=>x.id===T.selNote);if(n){n.img=url;n.upd=Date.now();await updateDoc(ref('notes',n.id),{img:url,upd:n.upd});$('#noteList').innerHTML=noteListHtml();$('#noteEd').innerHTML=noteEditorHtml()}}
        else if(kind.startsWith('npc:')){const id=kind.slice(4),n=T.npcs.find(x=>x.id===id);if(n){n.img=url;await updateDoc(ref('npcs',id),{img:url});render()}}
      }catch(er){toast('Não foi possível salvar a imagem.',true)}
    },()=>toast('Não foi possível ler essa imagem. Use JPG, PNG ou WebP.',true));return;
  }
  onEdit(e);
});

/* ---------- ações ---------- */
function arm(t){t.dataset.armed='1';t.dataset.label=t.textContent;t.textContent=t.dataset.confirm||'Confirmar?';t.classList.add('armed');setTimeout(()=>{if(t.isConnected&&t.dataset.armed==='1'){t.dataset.armed='';t.textContent=t.dataset.label;t.classList.remove('armed')}},3500)}
APP.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||!APP.contains(t))return;
  if(t.dataset.confirm!==undefined&&t.dataset.armed!=='1'){arm(t);return}
  Promise.resolve(act(t.dataset.act,t)).catch(er=>toast(er&&er.code==='permission-denied'?'Sem permissão para essa ação.':'Erro: '+(er&&er.message||er),true));
});
APP.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.scene')){if(d.open)openScenes.add(d.dataset.id);else openScenes.delete(d.dataset.id)}},true);
APP.addEventListener('submit',async e=>{
  if(e.target.id!=='authForm')return;e.preventDefault();
  const em=$('#aEmail').value.trim(),pw=$('#aPass').value;authMsg='';
  try{
    if(authMode==='login')await signInWithEmailAndPassword(auth,em,pw);else await createUserWithEmailAndPassword(auth,em,pw);
  }catch(er){authMsg='!'+(AUTH_ERR[er.code]||'Não foi possível entrar: '+(er.message||er));render();$('#aEmail').value=em}
});
const mvScene=async(id,d)=>{const i=T.scenes.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=T.scenes.length)return;const a=T.scenes[i],b=T.scenes[j],bt=writeBatch(db);bt.update(ref('scenes',a.id),{order:j});bt.update(ref('scenes',b.id),{order:i});await bt.commit()};
async function act(a,t){
  const id=t.dataset.id;
  switch(a){
    case 'auth-switch':authMode=authMode==='login'?'signup':'login';authMsg='';render();break;
    case 'auth-reset':{const em=$('#aEmail').value.trim();if(!em){authMsg='!Digite seu e-mail acima e toque em Esqueci a senha.';render();break}
      try{await sendPasswordResetEmail(auth,em);authMsg='Enviamos um e-mail para redefinir a senha.';}catch(er){authMsg='!'+(AUTH_ERR[er.code]||'Não foi possível enviar.')}render();$('#aEmail').value=em;break}
    case 'logout':await signOut(auth);location.hash='';break;
    case 'home':location.hash='#/';break;
    case 'set-mode':await setDoc(doc(db,'users',me.uid),{email:me.email,mode:t.dataset.m},{merge:true});prof={email:me.email,mode:t.dataset.m};homeTab=t.dataset.m;route();break;
    case 'home-tab':homeTab=t.dataset.t;render();break;
    case 'forget':{const tid=id;await deleteDoc(doc(db,'users',me.uid,'tables',tid));if(T&&T.id===tid)location.hash='#/';break}
    case 'table-new':{
      const name=($('#newTableName').value||'').trim();if(!name){toast('Dê um nome para a mesa.',true);break}
      const tid=doc(collection(db,'tables')).id,b=writeBatch(db);
      b.set(doc(db,'tables',tid),{name,ownerId:me.uid,ownerEmail:me.email,premise:'',modMap:{},inviteActive:false,inviteCode:'',createdAt:Date.now()});
      b.set(doc(db,'tables',tid,'members',me.uid),{uid:me.uid,email:me.email,role:'master',joinedAt:Date.now()});
      b.set(doc(db,'users',me.uid,'tables',tid),{name,role:'master',ts:Date.now()});
      await b.commit();location.hash='#/t/'+tid;break}
    case 'join-go':{
      const v=($('#joinLink').value||'').trim(),m=v.match(/#\/join\/([^/\s]+)\/([^/\s]+)/);
      if(!m){toast('Esse não parece um link de convite.',true);break}location.hash='#/join/'+m[1]+'/'+m[2];break}
    case 'join-kind':joinInfo.kind=t.dataset.k;render();break;
    case 'join-do':await doJoin();break;
    case 'tab':T.tab=t.dataset.t;render();break;
    /* dados */
    case 'die':{dCount=$('#dCount').value;dMod=$('#dMod').value;await roll(Number(t.dataset.n),dCount,dMod,'');break}
    case 'roll-attr':{const c=VC(),at=c.attrs.find(x=>x.id===id);await roll(20,1,mod(eff(at)),'Teste de '+at.name);break}
    case 'roll-skill':{const c=VC(),sk=c.skills.find(x=>x.id===id);await roll(20,1,sk.bonus,sk.name);break}
    case 'roll-init':{const c=VC();await roll(20,1,c.init,'Iniciativa');break}
    /* ficha */
    case 'hp':{if(role()!=='master')break;const c=VC();c.hp=Math.max(0,c.hp+Number(t.dataset.d));const i=$('[data-s="c"][data-f="hp"]');if(i)i.value=c.hp;const bar=$('#hpbar');if(bar){bar.style.width=hpPct(c)+'%';bar.className=hpClass(c)}writeChar({hp:c.hp},'hp');break}
    case 'char-create':{
      const c=creating;if(!c.name.trim()){toast('Dê um nome ao personagem.',true);break}
      const items=[c.i1,c.i2,c.i3].map(x=>x.trim()).filter(Boolean).slice(0,3).map(n=>({id:uid8(),name:n,qty:1,note:''}));
      await setDoc(charRef(me.uid),{ownerUid:me.uid,name:c.name.trim(),cls:c.cls,race:c.race,bg:c.bg,align:c.align,story:c.story,look:c.look,traits:c.traits,photo:'',level:1,xp:0,hp:10,hpMax:10,hpTemp:0,ac:10,init:0,speed:'9 m',
        attrs:['FOR','DES','CON','INT','SAB','CAR'].map((n,i)=>({id:'a'+(i+1),name:n,val:10,fx:[]})),skills:[],items,abilities:[],customs:[]});
      break}
    case 'add-li':{const l=t.dataset.l;if(!canList(l))break;const c=VC(),nid=uid8();
      const def={attrs:{name:'NOVO',val:10,fx:[]},skills:{name:'Nova perícia',bonus:0},items:{name:'Novo item',qty:1,note:''},abilities:{title:'Nova habilidade',tag:'',text:''},customs:{label:'Campo',value:''}}[l];
      c[l].push({id:nid,...def});const copy=JSON.parse(JSON.stringify(c[l]));writeChar({[l]:copy},l);render();const el=APP.querySelector(`[data-id="${nid}"]`);if(el)el.focus();break}
    case 'del-li':{const l=t.dataset.l;if(!canList(l))break;const c=VC();c[l]=c[l].filter(x=>x.id!==id);const copy=JSON.parse(JSON.stringify(c[l]));writeChar({[l]:copy},l);render();break}
    case 'fx-toggle':if(openFx.has(id))openFx.delete(id);else openFx.add(id);render();break;
    case 'fx-add':{if(role()!=='master')break;const c=VC(),fa=c.attrs.find(x=>x.id===t.dataset.a),isB=t.dataset.k==='buff';fa.fx.push({id:uid8(),name:isB?'Novo buff':'Novo debuff',val:isB?1:-1,on:true});openFx.add(fa.id);writeChar({attrs:JSON.parse(JSON.stringify(c.attrs))},'attrs');render();break}
    case 'fx-del':{if(role()!=='master')break;const c=VC(),fd=c.attrs.find(x=>x.id===t.dataset.a);fd.fx=fd.fx.filter(x=>x.id!==id);writeChar({attrs:JSON.parse(JSON.stringify(c.attrs))},'attrs');render();break}
    case 'rules-toggle':rulesOpen=!rulesOpen;render();break;
    case 'mm-reset':if(role()!=='master')break;T.doc.modMap={};await updateDoc(ref(),{modMap:{}});render();break;
    case 'photo-del':{const k=t.dataset.k;
      if(k==='char'){if(!canChar('photo'))break;VC().photo='';await updateDoc(charRef(role()==='master'?T.view:me.uid),{photo:''});render()}
      else if(k==='note'){const n=T.notes.find(x=>x.id===T.selNote);if(n){n.img='';await updateDoc(ref('notes',n.id),{img:''});render()}}
      else if(k.startsWith('npc:')){const nid=k.slice(4);const n=T.npcs.find(x=>x.id===nid);if(n){n.img='';await updateDoc(ref('npcs',nid),{img:''});render()}}break}
    /* npcs */
    case 'npc-new':{if(role()!=='master')break;await setDoc(doc(col('npcs')),{name:'Novo NPC',desc:'',img:'',claimedBy:null});break}
    case 'npc-del':{if(role()!=='master')break;await deleteDoc(ref('npcs',id));break}
    /* notas */
    case 'note-new':{const nr=doc(col('notes'));T.selNote=nr.id;nq='';await setDoc(nr,{authorUid:me.uid,title:'Nova anotação',tag:'Sessão',pin:false,upd:Date.now(),body:'',img:''});break}
    case 'note-sel':T.selNote=id;$('#noteList').innerHTML=noteListHtml();$('#noteEd').innerHTML=noteEditorHtml();break;
    case 'note-pin':{const n=T.notes.find(x=>x.id===id);n.pin=!n.pin;await updateDoc(ref('notes',id),{pin:n.pin});render();break}
    case 'note-del':T.selNote=null;await deleteDoc(ref('notes',id));break;
    /* roteiro */
    case 'sc-new':{if(role()!=='master')break;const sr=doc(col('scenes'));openScenes.add(sr.id);scFilter='Todas';await setDoc(sr,{order:T.scenes.length,title:'Nova cena',type:'Exploração',status:'Planejado',place:'',summary:'',objs:[],npcs:'',secrets:''});break}
    case 'sc-up':await mvScene(id,-1);break;
    case 'sc-down':await mvScene(id,1);break;
    case 'sc-del':await deleteDoc(ref('scenes',id));break;
    case 'sc-filter':scFilter=t.dataset.v;render();break;
    case 'add-obj':{const sc=T.scenes.find(x=>x.id===t.dataset.sc);sc.objs=sc.objs||[];sc.objs.push({id:uid8(),t:'Novo objetivo',done:false});openScenes.add(sc.id);await updateDoc(ref('scenes',sc.id),{objs:JSON.parse(JSON.stringify(sc.objs))});render();break}
    case 'del-obj':{const sc=T.scenes.find(x=>x.id===t.dataset.sc);sc.objs=sc.objs.filter(x=>x.id!==id);await updateDoc(ref('scenes',sc.id),{objs:JSON.parse(JSON.stringify(sc.objs))});render();break}
    /* mesa */
    case 'inv-new':await makeInvite();break;
    case 'inv-revoke':await revokeInvite();break;
    case 'inv-copy':{const box=$('#invLink');box.focus();box.select();
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(box.value):Promise.reject()).then(()=>toast('Link copiado.'),()=>toast('Link selecionado. Use Ctrl+C para copiar.'));break}
    case 'table-del':{const tid=T.id,b=writeBatch(db);if(T.doc.inviteCode)b.delete(ref('invites',T.doc.inviteCode));b.delete(doc(db,'users',me.uid,'tables',tid));b.delete(doc(db,'tables',tid));await b.commit();location.hash='#/';break}
    case 'leave':{const tid=T.id,b=writeBatch(db);if(role()==='npc'&&T.member.npcId)b.update(ref('npcs',T.member.npcId),{claimedBy:null});b.delete(ref('members',me.uid));b.delete(doc(db,'users',me.uid,'tables',tid));await b.commit();location.hash='#/';break}
  }
}
boot();
</script>
